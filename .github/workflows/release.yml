name: Release

# Publishes @bugsee/react-native and @bugsee/react-native-feedback to npm through TRUSTED PUBLISHING
# (OIDC): there is no npm token in this repository. Each package on npm has THIS workflow file
# registered as its trusted publisher (`node scripts/npm-trust-all.mjs`), so npm accepts the
# short-lived identity token GitHub mints for the run and nothing long-lived exists to leak.
#
# GitHub-hosted runner: npm trusted publishing does not support self-hosted runners
# (docs.npmjs.com/trusted-publishers).
#
# The file NAME is part of the trust relationship. Renaming it silently breaks publishing until
# every package is re-registered.
#
# Two jobs. `check` runs the gates, packs the tarballs and dry-runs the publish on any ref, and holds no
# publish rights. `publish`
# needs it, runs only for a real publish, and is the only job with the OIDC token and the `npm-publish`
# environment. The gates are the same lint, typecheck and unit tests CI runs, the release metadata
# gate, and `prepack`'s refusal to pack a SNAPSHOT pin. `latest` is never the default, and publish-all.mjs refuses `latest` for a prerelease
# version, so neither a forgotten nor a mistyped tag can put a beta where nobody asked for one.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: npm dist-tag to publish under (a prerelease can never go to latest)
        type: choice
        options: [beta, next, latest]
        default: beta
        required: true
      dry_run:
        description: Pack and `npm publish --dry-run` only; publishes nothing
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

env:
  # Never a real token; the gates only read these, and nothing here reaches the Bugsee API.
  BUGSEE_TOKEN_IOS: 00000000-0000-4000-8000-000000000000
  BUGSEE_TOKEN_ANDROID: 00000000-0000-4000-8000-000000000000
  BUGSEE_ENDPOINT: http://127.0.0.1:9

jobs:
  check:
    name: gates and dry run
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - run: corepack enable

      - run: yarn install --immutable

      - name: Gates (the same as CI's js job)
        run: |
          yarn lint
          yarn typecheck
          yarn test

      - name: Release gate (metadata, one version, peer ranges)
        run: node scripts/check-publishable.mjs

      # Inputs go in through the environment, never interpolated into the script text: a `${{ }}`
      # inside `run:` is textually pasted into the shell.
      - name: Dry-run publish
        env:
          NPM_TAG: ${{ inputs.tag }}
        run: node scripts/publish-all.mjs --tag "$NPM_TAG" --dry-run --pack-to "$RUNNER_TEMP/tarballs"

      # The bytes that passed the gates are the bytes `publish` uploads to npm.
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: tarballs
          path: ${{ runner.temp }}/tarballs
          if-no-files-found: error
          retention-days: 7

  publish:
    name: publish
    needs: check
    if: ${{ !inputs.dry_run }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # The control that actually limits who can publish. npm's trusted publisher is registered by
    # repository, workflow file and THIS environment, and the environment's deployment-branch rule
    # restricts it to main, so a branch that edits this file cannot mint a publish token. The guard
    # step below is a convenience, not the control.
    environment: npm-publish
    permissions:
      contents: read
      id-token: write # the OIDC token npm exchanges for publish rights
    steps:
      - name: A real publish runs from main only
        env:
          REF: ${{ github.ref }}
        run: |
          if [ "$REF" != "refs/heads/main" ]; then
            echo "::error::a real publish runs only from main (this run is on $REF)"
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - run: corepack enable

      # Trusted publishing needs npm >= 11.5.1; fail loudly rather than fall back to a token prompt.
      - name: Check npm version
        run: |
          npm --version
          node -e 'const [a,b,c]=process.argv[1].split(".").map(Number); if (a<11||(a===11&&(b<5||(b===5&&c<1)))) { console.error("npm >= 11.5.1 required"); process.exit(1) }' "$(npm --version)"

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: tarballs
          path: ${{ runner.temp }}/tarballs

      # No `yarn install` and no lifecycle script runs here: this job holds the OIDC token, so it
      # only publishes the tarballs `check` packed and validated.
      - name: Publish
        env:
          NPM_TAG: ${{ inputs.tag }}
        run: node scripts/publish-all.mjs --tag "$NPM_TAG" --tarballs "$RUNNER_TEMP/tarballs"

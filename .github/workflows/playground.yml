name: playground

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - 'examples/playground/**'
      - 'packages/**'
      - '.github/workflows/playground.yml'
      - 'yarn.lock'
  workflow_dispatch:

concurrency:
  group: playground-${{ github.ref }}
  cancel-in-progress: true

env:
  # Never a real token: CI only builds, so a well-formed placeholder is enough.
  BUGSEE_APP_TOKEN: 00000000-0000-4000-8000-000000000000
  # A dead loopback port, so nothing a job runs can reach the Bugsee API.
  BUGSEE_ENDPOINT: http://127.0.0.1:9

jobs:
  js:
    name: playground typecheck, lint, tests, host check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.18'
      - run: corepack enable
      - run: yarn install --immutable
      - run: yarn workspace bugsee-playground typecheck
      - run: yarn eslint examples/playground
      - run: yarn workspace bugsee-playground test --ci
      - run: node scripts/cli-check-no-internal-hosts.ts

  android:
    name: playground android build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Fails fast, before any setup or Gradle download: native-versions.json
      # can pin a SNAPSHOT built from a private clone, which CI cannot
      # resolve. Same guard as the android job in ci.yml.
      - name: Refuse a local SNAPSHOT pin
        run: |
          sdk=$(jq -r '.android.sdk' native-versions.json)
          if [[ "$sdk" == *-SNAPSHOT ]]; then
            echo "::error title=Local SNAPSHOT pin::native-versions.json pins Android ${sdk}, built from a private clone; CI cannot resolve it."
            exit 1
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: '22.18'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: corepack enable
      - run: yarn install --immutable
      - working-directory: examples/playground
        run: CI=1 npx expo prebuild -p android --no-install
      - working-directory: examples/playground/android
        run: ./gradlew :app:assembleDebug --no-daemon

  ios:
    name: playground ios simulator build
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.18'
      - run: corepack enable
      - run: yarn install --immutable
      # Without --no-install, so prebuild runs pod install and generates the
      # .xcworkspace.
      - working-directory: examples/playground
        run: CI=1 npx expo prebuild -p ios
      - working-directory: examples/playground/ios
        run: |
          set -o pipefail
          xcodebuild -workspace BugseePlayground.xcworkspace -scheme BugseePlayground \
            -sdk iphonesimulator -configuration Debug -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO build | tail -20

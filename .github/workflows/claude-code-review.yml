name: Claude Code Review

# Posts an automated review on every pull request. Reads only -- it never
# builds, tests, or pushes. ci.yml owns the test suite.
on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]
    # Deliberately no `branches:` filter. Phase work in this repo lands as PRs
    # stacked onto other feature branches, and a review is worth having there too.

jobs:
  claude-review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # write, not read: the review posts inline comments back onto the PR.
      pull-requests: write
      issues: write
      # gh pr view reads statusCheckRollup, which 403s without this.
      checks: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Deliberately not the code-review plugin. It delegates each step to sub-agents, and
          # the Agent tool here is async: it yields for a notification that a single-shot CI run
          # never delivers. Denied that, it burns turns shelling out instead. A direct prompt is
          # single-shot by construction.
          prompt: |
            Review pull request ${{ github.event.pull_request.number }} in ${{ github.repository }}.

            This is the Bugsee React Native SDK: a TypeScript facade over a TurboModule, bridging
            to the native Bugsee Android and Apple SDKs. It is published to npm and integrated
            into other people's apps, so a defect here ships inside products Bugsee does not own.

            Read the diff with `gh pr diff ${{ github.event.pull_request.number }}`. Read the
            Global Constraints section of `docs/design/plans/2026-09-16-implementation-plan.md`,
            `docs/design/2026-09-15-sdk-design.md` where it governs the changed files, and any
            CLAUDE.md that applies. Read the surrounding code where you need context. Do not
            build, test, lint, or modify the checkout — CI covers that separately.

            Report only what you are confident is a real problem in the lines this PR changes:

            - Bridge agreement. The TurboModule spec in `src/NativeBugsee.ts`, the Java
              implementation and the ObjC++ implementation must stay in step. A method added to
              one and not the others fails at runtime, not at compile time. Check that every
              Promise path settles: one that neither resolves nor rejects hangs the caller's
              JavaScript forever with no error.
            - Main thread on Apple. Every Bugsee SDK call must reach the SDK on the main thread;
              `launchWithToken:` off-main misbehaves. The hop must not be a bare
              `dispatch_sync` onto the main queue, which deadlocks when already on it.
            - Enum and option marshalling. Enum options cross the bridge as numbers and must be
              converted on Android with the enum's own `fromIntValue`/`fromRawValue`, NEVER
              `values()[n]`: four of the five option enums have internal values that differ from
              their ordinals (`LogLevel.Error` is value 1, ordinal 0). Status wire numbers are a
              shared contract between the JS `Status` constants and both bridges — not an
              implementation detail either side may renumber.
            - Option keys. Launch options must be real `com.bugsee.option.*` strings. Both native
              SDKs drop an unrecognised key silently, so a typo is invisible at runtime and in
              tests. `endpoint` is the documented exception: Android takes
              `com.bugsee.option.$$ENDPOINT`, Apple takes the plain `endpoint`, and the Apple
              value must carry a `/v2` suffix.
            - Native version pinning. Anything version-shaped must come from
              `native-versions.json`. The SPM `exact:` pin and the podspec's download URL point at
              the same artifact and must never disagree, or an app gets a different SDK depending
              on how it integrates.
            - Both Apple delivery paths. The bridge ships over SPM and CocoaPods. CocoaPods masks
              some SPM-only failures — RN's post-install sets the C++ standard on every pod, so a
              missing `cxxLanguageStandard` breaks SPM while pods pass. A change touching
              `ios/Package.swift`, the podspec, or the bridge's imports needs to hold for both.
            - Privacy and redaction. A filter callback that cannot complete must DROP the event,
              never pass it through: failing open at a redaction boundary leaks exactly what the
              callback existed to remove. Secure-rectangle version tokens must change whenever the
              rectangles do, or the SDK keeps redacting a stale region.
            - Wire contracts. The exception payload's `ReactNativeWebException` name is what the
              backend routes on; renaming it silently stops React Native crashes being recognised.
            - Untrusted input from JavaScript. JS is untyped, so a TurboModule parameter declared
              `string` can arrive as a number, an array or null. Objective-C will not stop it —
              the pointer is typed `NSString*` and only fails when a string selector reaches it.
            - Credentials. No app token, endpoint or other secret may appear in any committed
              file, including tests and fixtures.
            - Broken contracts and violations of a documented rule you can quote.

            Skip nitpicks, formatting and style, missing tests, and anything tsc, ESLint, the
            Java compiler or the Objective-C compiler catches. Pre-existing issues are out of
            scope.

            Post the review in two parts.

            1. One INLINE comment per finding, on the line it is about, using the
               mcp__github_inline_comment__create_inline_comment tool. Each one says what is wrong
               and why it matters, and proposes the concrete change. Keep it to a few sentences —
               the reasoning that does not fit belongs in the summary. Only comment on lines this
               PR actually changed; GitHub rejects the rest.

            2. Then exactly ONE summary comment on the conversation, with
               `gh pr comment ${{ github.event.pull_request.number }} --body "..."`. This is the
               part a reviewer reads first: what the change does, whether it is sound, what the
               findings add up to, and what you recommend. Do not repeat the inline comments —
               reference them.

            Be accurate about what you actually checked. If a claim in the PR description rests on
            a device run or a build you cannot see from the diff, say it is unverified rather than
            implying you confirmed it.

            ALWAYS post the summary, even with nothing to report — a silent run is
            indistinguishable from a broken one. Use this shape:

            ### Code review

            <one or two sentences on what the change does and whether it holds together>

            **Findings:** N inline (M blocking) — or "None."

            <recommendation: merge as is / fix the blocking ones first / and why>

          claude_args: >-
            --allowedTools
            "Read,Grep,Glob,Bash,mcp__github_inline_comment__create_inline_comment"
          # --allowedTools REPLACES the default tool list rather than adding to it, so every
          # tool the prompt needs has to be named here.

          # Prints the full agent transcript into the job log. Without it a denied tool or a run
          # that ends without posting looks identical to a silent success -- that cost five blind
          # debugging rounds on the Android repo. The transcript can echo tool output, which is
          # acceptable while this repository is private and its Actions logs are
          # collaborator-only. Drop it if the repository is ever made public.
          show_full_output: true

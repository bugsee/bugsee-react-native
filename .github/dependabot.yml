version: 2
updates:
  - package-ecosystem: "npm"
    directories:
      - "/"
      - "/packages/*"
      - "/examples/*"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
  - package-ecosystem: "bundler"
    directory: "/examples/bare"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5

apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "com.facebook.react"
// Resolved in the root build.gradle, applied here: the plugin attaches its
// tasks to an Android variant, so it has to land on the module that has one.
apply plugin: "com.bugsee.android.gradle"


/**
 * This is the configuration block to customize your React Native Android app.
 * By default you don't need to apply any configuration, just uncomment the lines you need.
 */
react {
    /* Folders */
    //   The root of your project, i.e. where "package.json" lives. Default is '../..'
    // root = file("../../")
    //   The folder where the react-native NPM package is. Default is ../../node_modules/react-native
    // reactNativeDir = file("../../node_modules/react-native")
    //   The folder where the react-native Codegen package is. Default is ../../node_modules/@react-native/codegen
    // codegenDir = file("../../node_modules/@react-native/codegen")
    //   The cli.js file which is the React Native CLI entrypoint. Default is ../../node_modules/react-native/cli.js
    // cliFile = file("../../node_modules/react-native/cli.js")

    /* Variants */
    //   The list of variants to that are debuggable. For those we're going to
    //   skip the bundling of the JS bundle and the assets. Default is "debug", "debugOptimized".
    //   If you add flavors like lite, prod, etc. you'll have to list your debuggableVariants.
    // debuggableVariants = ["liteDebug", "liteDebugOptimized", "prodDebug", "prodDebugOptimized"]

    /* Bundling */
    //   A list containing the node command and its flags. Default is just 'node'.
    // nodeExecutableAndArgs = ["node"]
    //
    //   The command to run when bundling. By default is 'bundle'
    // bundleCommand = "ram-bundle"
    //
    //   The path to the CLI configuration file. Default is empty.
    // bundleConfig = file(../rn-cli.config.js)
    //
    //   The name of the generated asset file containing your JS bundle
    // bundleAssetName = "MyApplication.android.bundle"
    //
    //   The entry file for bundle generation. Default is 'index.android.js' or 'index.js'
    // entryFile = file("../js/MyApplication.android.js")
    //
    //   A list of extra flags to pass to the 'bundle' commands.
    //   See https://github.com/react-native-community/cli/blob/main/docs/commands.md#bundle
    // extraPackagerArgs = []

    /* Hermes Commands */
    // Preserve the JS bundle, then inject the composed map after hermesc.
    hermesCommand = file("../../node_modules/@bugsee/react-native/scripts/hermesc-preserve-js.sh").absolutePath
    //
    //   The list of flags to pass to the Hermes compiler. By default is "-O", "-output-source-map"
    // hermesFlags = ["-O", "-output-source-map"]

    /* Autolinking */
    autolinkLibrariesWithApp()
}

/**
 * Set this to true to Run Proguard on Release builds to minify the Java bytecode.
 * Task 7.5a (and 7.1c's keep-rule check) turn it on with -PbugseeE2eMinify=true.
 */
def enableProguardInReleaseBuilds = findProperty('bugseeE2eMinify') == 'true'

/**
 * The preferred build flavor of JavaScriptCore (JSC)
 *
 * For example, to use the international variant, you can use:
 * `def jscFlavor = io.github.react-native-community:jsc-android-intl:2026004.+`
 *
 * The international variant includes ICU i18n library and necessary data
 * allowing to use e.g. `Date.toLocaleString` and `String.localeCompare` that
 * give correct results when using with locales other than en-US. Note that
 * this variant is about 6MiB larger per architecture than default.
 */
def jscFlavor = 'io.github.react-native-community:jsc-android:2026004.+'

android {
    ndkVersion rootProject.ext.ndkVersion
    buildToolsVersion rootProject.ext.buildToolsVersion
    compileSdk rootProject.ext.compileSdkVersion

    namespace "com.bareexample"
    defaultConfig {
        applicationId "com.bareexample"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        // Campaign N-15 U-02 (e2e/upgrade.test.ts): the same app with a higher
        // version, `-PbugseeE2eVersionCode=2`; 1 / "1.0" otherwise.
        versionCode((findProperty('bugseeE2eVersionCode') ?: '1').toInteger())
        versionName findProperty('bugseeE2eVersionCode') == null ? "1.0" : "1.${findProperty('bugseeE2eVersionCode')}"
    }
    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }
    // Campaign N-02 (e2e/attach.test.ts): `-PbugseeE2eAutoLaunch=true` merges
    // src/e2eAutoLaunch/AndroidManifest.xml into the debug build, so the SDK
    // launches itself from `com.bugsee.app-token` meta-data (the placeholder
    // token, against the dead endpoint) before any JS runs. Off by default:
    // a build without the property has no such meta-data.
    if (findProperty('bugseeE2eAutoLaunch') == 'true') {
        sourceSets {
            debug {
                manifest.srcFile 'src/e2eAutoLaunch/AndroidManifest.xml'
            }
        }
    }
    buildTypes {
        debug {
            signingConfig signingConfigs.debug
            // AGP defaults this to NONE, so the plugin's native upload finds
            // nothing and skips. SYMBOL_TABLE emits symbols for code this app
            // builds. Maven Hermes and libreactnative.so are pre-stripped;
            // this level does not symbolicate those two.
            ndk {
                debugSymbolLevel 'SYMBOL_TABLE'
            }
        }
        release {
            // Caution! In production, you need to generate your own keystore file.
            // see https://reactnative.dev/docs/signed-apk-android.
            signingConfig signingConfigs.debug
            // Device e2e only (e2e/report-handler.test.ts, case 6): a crash
            // must kill the process, which needs a bundle without dev support,
            // and the retained report must still be readable, which needs
            // `run-as` -- so a debuggable release. Dev support follows the
            // build type, not this flag. Off unless asked for.
            debuggable findProperty('bugseeE2eDebuggable') == 'true'
            minifyEnabled enableProguardInReleaseBuilds
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
            // Same level as debug: run-android.sh is assembleDebug, and a
            // release build needs the metadata too. Pre-stripped Maven Hermes
            // and libreactnative.so are not symbolicated by this.
            ndk {
                debugSymbolLevel 'SYMBOL_TABLE'
            }
        }
    }
}

// Debug ids and source-map upload for release bundles: after each
// createBundle<Variant>JsAndAssets the hook injects the debug id into the
// composed map and the bytecode (Hermes) or Metro's bundle and map (no Hermes),
// then uploads the map when bugsee.properties holds a real token. It fails
// the bundle task if Hermes ran without hermesc-preserve-js.sh (hermesCommand
// above). -PbugseeUploadSourcemaps=false turns the upload off.
apply from: file("../../node_modules/@bugsee/react-native/scripts/bugsee-sourcemaps.gradle")

// Same file the root project parses to check the Gradle plugin pin.
def nativeVersions = new groovy.json.JsonSlurper().parse(rootProject.file("../../../native-versions.json"))

dependencies {
    // The version of react-native is set by the React Native Gradle Plugin
    implementation("com.facebook.react:react-android")

    // plugin.ndk.enabled makes the plugin add bugsee-android-ndk on its own
    // version range, because the wrapper's api dependency is not a direct
    // dependency of :app. Declare it here at native-versions.json's
    // android.sdk, the same pin the wrapper uses.
    implementation "com.bugsee:bugsee-android-ndk:${nativeVersions.android.sdk}"

    if (hermesEnabled.toBoolean()) {
        implementation("com.facebook.react:hermes-android")
    } else {
        implementation jscFlavor
    }
}

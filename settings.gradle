// Standalone build for the Android bridge's unit tests. In a real app the
// module is pulled in by React Native autolinking, which supplies its own
// settings; this exists so `./gradlew test` can run the marshalling tests in
// CI without first building an example app.
pluginManagement {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
    plugins {
        // Pinned here rather than in the module, so the standalone test build
        // and a consuming app cannot disagree about AGP.
        id 'com.android.library' version '8.6.0'
    }
}
dependencyResolutionManagement {
    repositories {
        google()
        mavenCentral()
        // Only while native-versions.json pins a SNAPSHOT: mavenLocal is a
        // human's own machine, not a build input anyone else can reproduce,
        // and ~/.m2 on this one already holds stale non-SNAPSHOT builds of
        // com.bugsee artifacts. The content filter is load-bearing -- without
        // it those stale versions could satisfy a normal request too.
        def nativeVersions = new groovy.json.JsonSlurper()
                .parse(new File(settingsDir, 'native-versions.json'))
        if (nativeVersions.android.sdk.endsWith('-SNAPSHOT')) {
            mavenLocal {
                content { includeVersionByRegex('com\\.bugsee', '.*', '.*-SNAPSHOT') }
            }
        }
    }
}
rootProject.name = 'bugsee-react-native'
include ':bugsee-android-bridge'
project(':bugsee-android-bridge').projectDir = file('packages/react-native/android')

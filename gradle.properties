# The Bugsee Android SDK 7.x is AndroidX-based, so any consumer is too.
android.useAndroidX=true
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8

# This build exists only to run the bridge's marshalling unit tests without
# first building an example app. See packages/react-native/android/build.gradle.
bugsee.standalone=true

# React Native cannot use Yarn's PnP default: Metro, the autolinker and
# CocoaPods all expect a real node_modules tree on disk.
nodeLinker: node-modules

# Keep each workspace's dependencies in its own node_modules rather than
# hoisting everything to the root, so a package cannot accidentally rely on
# a dependency it does not declare.
nmHoistingLimits: workspaces

enableScripts: true

// The Android side of the bridge.
//
// Split deliberately: everything in `com.bugsee.reactnative` that translates
// between the JS wire shape and the Bugsee SDK's types is plain Java with no
// React Native dependency, so it is unit-testable here without codegen or a
// device. The TurboModule that calls into it does need React Native and the
// generated spec, and is exercised by the example app instead.
plugins {
    id 'com.android.library'
}

// Finding the single version source takes more care than it looks like it
// should. `rootDir` is the app's root project, not this repo's, so that is out.
// And `projectDir` inside an app is the *autolink symlink*
// (<app>/node_modules/@bugsee/react-native/android), so walking up from it
// lands in <app>/node_modules, not in this repo. Canonicalise first, then walk
// up until the file appears.
def nativeVersionsFile = { ->
    def dir = projectDir.canonicalFile
    while (dir != null) {
        def candidate = new File(dir, 'native-versions.json')
        if (candidate.isFile()) {
            return candidate
        }
        dir = dir.parentFile
    }
    throw new GradleException(
            "native-versions.json not found above ${projectDir.canonicalFile}. " +
            "Every pinned native version comes from that one file.")
}()
def nativeVersions = new groovy.json.JsonSlurper().parse(nativeVersionsFile)

// The wrapper's own version, compiled in so the init provider can report an
// identity with no JS runtime. Found the same way as native-versions.json and
// for the same reason: inside an app, projectDir is the autolink symlink.
def packageJsonFile = { ->
    def dir = projectDir.canonicalFile
    while (dir != null) {
        def candidate = new File(dir, 'package.json')
        if (candidate.isFile()
                && new groovy.json.JsonSlurper().parse(candidate).name == '@bugsee/react-native') {
            return candidate
        }
        dir = dir.parentFile
    }
    throw new GradleException(
            "@bugsee/react-native package.json not found above ${projectDir.canonicalFile}. " +
            "The wrapper version reported to the SDK comes from that one file.")
}()
def wrapperVersion = new groovy.json.JsonSlurper().parse(packageJsonFile).version

// Two builds consume this file.
//
// Inside an app, React Native's autolinking includes the module and the app's
// settings.gradle has already substituted in `com.facebook.react`, which runs
// codegen and puts react-android on the compile classpath. That is the real
// configuration and the default here.
//
// The repo-root build exists only to run the marshalling unit tests without
// first building an app, and has neither the plugin nor an app to resolve
// react-android from. It sets `bugsee.standalone=true`, and this file then
// drops the TurboModule — the one source that needs both — from the source
// set. The tests cover the plain-Java classes, which are all that build is for.
def standalone = providers.gradleProperty('bugsee.standalone').getOrElse('false') == 'true'
if (!standalone) {
    apply plugin: 'com.facebook.react'
}

android {
    namespace 'com.bugsee.reactnative'
    compileSdk 35

    defaultConfig {
        // The Bugsee Android SDK supports API 21+ and defends that floor
        // deliberately (its own build pins androidx.webkit to 1.14.0 because
        // 1.15.0+ require 23/24). A wrapper must not raise the floor above the
        // SDK it wraps.
        minSdk 21

        // Read by ReactNativeWrapperInitProvider, which registers the wrapper
        // before any JS exists and so cannot be handed this from the bridge.
        buildConfigField 'String', 'WRAPPER_VERSION', "\"${wrapperVersion}\""
    }

    buildFeatures {
        buildConfig true
    }

    compileOptions {
        // Matches the SDK, which compiles at 1.8 throughout (and pins
        // jvmTarget to JVM_1_8). Emitting newer bytecode from the wrapper than
        // the library it bridges to buys nothing and narrows who can consume it.
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    if (standalone) {
        sourceSets {
            main {
                java.exclude 'com/bugsee/reactnative/BugseeModule.java'
                java.exclude 'com/bugsee/reactnative/BugseePackage.java'
            }
        }
    }

    testOptions {
        // android.util.Log is not implemented in a plain JVM test; by default
        // every call throws "not mocked". That turns a catch block whose only
        // job is to log into a rethrow, so a test asserting "this must not
        // escape" fails for a reason that cannot happen on a device. Defaults
        // make the framework stubs inert instead.
        unitTests.returnDefaultValues = true
        unitTests.all {
            useJUnit()
            testLogging { events 'passed', 'failed', 'skipped' }
        }
    }
}

dependencies {
    // Pinned from the single version source so the enum values these tests
    // assert on are the ones that actually ship.
    api "com.bugsee:bugsee-android:${nativeVersions.android.sdk}"
    // Native crash detection is a SEPARATE artifact. Without it the SDK looks
    // correctly integrated and silently reports no native crash at all: a real
    // SIGSEGV on a device produced a tombstone, no Bugsee report, and no NDK
    // line in logcat. The only thing the wrapper saw was a RelaunchedAfterCrash
    // lifecycle event, which comes from ApplicationExitInfo and is not a report.
    // `api`, not `implementation`, to match the core SDK: an app that wants to
    // configure NdkOptions needs the types on its own compile classpath.
    api "com.bugsee:bugsee-android-ndk:${nativeVersions.android.sdk}"
    // For @Nullable/@NonNull. The SDK exposes these types in its own public
    // API, so a consumer has androidx.annotation on the classpath regardless.
    implementation 'androidx.annotation:annotation:1.9.1'
    if (!standalone) {
        implementation 'com.facebook.react:react-android'
    }
    testImplementation 'junit:junit:4.13.2'
}
